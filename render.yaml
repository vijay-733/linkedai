services:
  - type: web
    name: linkedai
    runtime: node
    rootDir: .
    buildCommand: cd frontend && npm install && node ./node_modules/vite/bin/vite.js build && cd ../backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
